name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier que les données générées sont à jour
        run: |
          node scripts/build-data.mjs
          git diff --exit-code -- src/data
      - run: npm run lint
      - run: npm test
      - run: npm run build
